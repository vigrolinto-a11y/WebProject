<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky View - Search</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
	<link rel="stylesheet" type="text/css" href="Search Bar.css">

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo-link">
      <div class="logo-section">
        <img src="LOGO.png" alt="Sky View Logo" class="logo">
        <h2>Sky View</h2>
      </div>
    </a>

     <nav>  
      <a href="index.html" class="active">Home</a>  
      <a href="SV Ex.html">Explore</a>  
      <a href="Birds SV.html">Birds</a>  
      <a href="About Us.html">About Us</a>  
      <a href="Login.html" class="login-icon" title="Login">
        <img src="https://img.icons8.com/ios-filled/30/ffffff/user.png" alt="Login Icon">
      </a>
    </nav>  
  </header>

  <!-- SEARCH SECTION -->
  <main class="search-section">
    <h1>Search the Sky View Website</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search birds, locations, or topics...">
      <button id="searchBtn">🔍</button>
    </div>

    <div id="searchResults" class="results"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Sky View | Birdwatching in Botswana</p>
  </footer>

  <!-- SIMPLE SEARCH SCRIPT -->
  <script>
    const pages = [
      { title: "Home", url: "index.html", content: "Botswana birdwatching, African Skimmer, Pel’s Fishing Owl, Yellow-billed Stork, Sky View homepage" },
      { title: "Explore", url: "explore.html", content: "Explore bird habitats, Okavango Delta, best time for birdwatching, Botswana nature" },
      { title: "Birds", url: "birds.html", content: "African Jacana, Malachite Kingfisher, White-Crowned Lapwing, Coucal, Flamingos" },
      { title: "About Us", url: "about.html", content: "About our project, bird conservation, Botswana wildlife awareness" },
      { title: "Login", url: "login.html", content: "User login, Sky View account access, sign in page" }
    ];

    const searchBtn = document.getElementById("searchBtn");
    const searchInput = document.getElementById("searchInput");
    const resultsDiv = document.getElementById("searchResults");

    searchBtn.addEventListener("click", () => {
      const query = searchInput.value.toLowerCase().trim();
      resultsDiv.innerHTML = "";

      if (query === "") {
        resultsDiv.innerHTML = "<p class='notice'>Please enter a search term.</p>";
        return;
      }

      const matches = pages.filter(page =>
        page.title.toLowerCase().includes(query) ||
        page.content.toLowerCase().includes(query)
      );

      if (matches.length === 0) {
        resultsDiv.innerHTML = "<p class='notice'>No results found for \"" + query + "\".</p>";
      } else {
        resultsDiv.innerHTML = "<h2>Results:</h2>" + 
          matches.map(m => `
            <div class="result-item">
              <h3>${m.title}</h3>
              <p>${m.content.slice(0, 100)}...</p>
              <a href="${m.url}">Go to page</a>
            </div>
          `).join("");
      }
    });

    // Press Enter to search
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        searchBtn.click();
      }
    });
  </script>

</body>
</html>
